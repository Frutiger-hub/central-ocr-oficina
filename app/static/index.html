<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central OCR Oficina</title><link rel="stylesheet" href="/static/styles.css"></head><body><main class="container"><header class="hero"><div><p class="eyebrow">CENTRAL OCR</p><h1>Lançamento de oficina</h1><p class="subtitle">Leia o PDF, confira os campos e acrescente uma nova linha ao Excel central.</p></div><div id="health" class="pill">Verificando...</div></header><section class="card"><h2>1. Documento</h2><label class="dropzone"><input id="pdf" type="file" accept="application/pdf"><span class="drop-title">Escolha ou arraste o PDF aqui</span><span class="drop-help">O OCR será executado localmente.</span></label><button id="scanBtn" class="primary" disabled>Extrair dados</button><p id="scanStatus" class="muted"></p></section><section class="card"><div class="section-head"><h2>2. Conferência</h2><span id="filename" class="muted"></span></div><div class="grid"><label>O.S.<input id="os" type="number"></label><label>Cliente<input id="cliente" type="text"></label><label>Técnico<input id="tecnico" list="technicians" type="text" placeholder="Digite ou selecione"><datalist id="technicians"></datalist></label><label>Data<input id="data" type="date"></label><label>Data final<input id="dataFinal" type="date"></label><label>Status<input id="status" type="text" readonly></label><label>Cor<select id="cor"><option>AZ</option><option>BR</option><option>AM</option><option>ROSA</option></select></label><label>Potência<input id="potencia" type="text"></label></div><label class="check"><input id="rebobinamento" type="checkbox"><span>Houve rebobinamento</span></label><div class="hint">Sem rebobinamento: somente <b>MONTADOS</b>. Com rebobinamento: <b>MONTADOS</b> e <b>ENROLADOR</b>.</div><button id="launchBtn" class="primary" disabled>Confirmar lançamento</button><p id="launchStatus" class="muted"></p></section><section class="card"><h2>3. Resultado</h2><pre id="result" class="result">Aguardando lançamento...</pre></section></main><script src="/static/app.js"></script></body></html>
